name: Confirm Voxel Bikes Pages release
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'voxel-bikes-v0.7'
    runs-on: ubuntu-latest
    steps:
      - name: Verify hosted and offline HTML
        run: |
          expected='98b006184c60e1994180381b089b027423ca7fab'
          for attempt in {1..12}; do
            if curl -fsSL --max-time 10 "https://achallakiran.github.io/voxel-bike/?release=0.7&attempt=$attempt" -o /tmp/voxel-live.html &&
               curl -fsSL --max-time 10 "https://achallakiran.github.io/voxel-bike/Voxel-Bikes-Offline.html?release=0.7&attempt=$attempt" -o /tmp/voxel-offline.html &&
               test "$(git hash-object /tmp/voxel-live.html)" = "$expected" &&
               cmp /tmp/voxel-live.html /tmp/voxel-offline.html; then
              echo "Pages and offline release both match $expected"
              exit 0
            fi
            sleep 10
          done
          exit 1
